name: Validar integração Firebase (homologação)
on:
  push:
    branches: [main]
    paths:
      - 'staging/**'
      - '.github/workflows/staging-validate.yml'
  pull_request:
    paths:
      - 'staging/**'
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar JavaScript e ausência de login demonstrativo
        run: |
          node --check staging/firebase-client.js
          python3 - <<'PY'
          from pathlib import Path
          html=Path('staging/index.html').read_text(encoding='utf-8')
          assert '<script type="module" src="./firebase-client-20260920-v3.js"></script>' in html
          client=Path('staging/firebase-client.js').read_text(encoding='utf-8')
          assert 'lookupPublicStatus(code)' in client
          assert 'lookupFullRequest(code)' in client
          assert 'renderLookupDetails(summary,full)' in html
          assert html.count('id="lookupForm"') == 1
          assert 'data-open-lookup="true"' in html
          assert 'syncPublicStatuses(requests)' in client
          assert 'Demo@2026' not in html
          assert 'localStorage' not in html
          Path('/tmp/ecovias-stage.js').write_text(html.split('<script>',1)[1].split('</script>',1)[0],encoding='utf-8')
          PY
          node --check /tmp/ecovias-stage.js
