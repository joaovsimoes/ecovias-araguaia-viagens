name: Validar portal
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar JavaScript do protótipo
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path('prototype/portal_viagens.html').read_text(encoding='utf-8')
          js = html.split('<script>', 1)[1].split('</script>', 1)[0]
          Path('/tmp/portal.js').write_text(js, encoding='utf-8')
          assert 'const wrapper=buildConfiguredServiceMarkup(type);BASE_FIELD_DEFS' not in js
          PY
          node --check /tmp/portal.js
      - name: Verificar configuração do Firebase
        run: python3 -m json.tool firebase.json >/dev/null && python3 -m json.tool .firebaserc >/dev/null
